version: "3.9"

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/1433' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - app_network

  backend:
    build: .
    container_name: backend
    restart: unless-stopped
    ports:
      - "5000:80"
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConexion=Server=sqlserver;Database=TallerControlBD;User=sa;Password=${SA_PASSWORD};TrustServerCertificate=True
      - Jwt__Key=F2@kP9!dT3^zB7#qM5%wV8&xR1*eY4$hJ6@uL0!sC9^tN3#pG2%rQ7&vD5*uA8$zW4
      - Jwt__Issuer=MiApp
      - Jwt__Audience=MiAppUsuarios
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  frontend:
    build: ../frontend
    container_name: frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network

volumes:
  sql_data:

networks:
  app_network: